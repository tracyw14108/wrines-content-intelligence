name: Zodiac Reels Outfit Uniqueness QA

on:
  push:
    paths:
      - 'config/zodiac-reels-outfit-policy.json'
      - 'data/zodiac-reels/**'
      - 'scripts/check_zodiac_reels_outfits.py'
      - '.github/workflows/zodiac-reels-outfit-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject duplicated top, bottom or complete outfit
        run: python scripts/check_zodiac_reels_outfits.py
