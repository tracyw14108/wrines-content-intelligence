name: Weekly Content Intelligence

on:
  workflow_dispatch:
  schedule:
    # Monday 09:00 Asia/Taipei = Monday 01:00 UTC
    - cron: '0 1 * * 1'

permissions:
  contents: write

jobs:
  build-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build report from newest snapshot
        run: python scripts/build_weekly_report.py

      - name: Commit generated report when changed
        run: |
          if [[ -n "$(git status --porcelain data/winners)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/winners
            git commit -m "chore: update weekly winner report"
            git push
          else
            echo "No report changes to commit."
          fi
